<!doctype html>
<html lang="en" class="calcite-mode-light">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<title>Survey Map · Survey Assignment &amp; Approval</title>

		<!-- Import map: lets the Map Components package resolve its internal bare
		     `@arcgis/core/...` imports to the same 4.31 CDN build the page imports.
		     MUST come before any module script. -->
		<script type="importmap">
			{
				"imports": {
					"@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
				}
			}
		</script>

		<!-- Calcite Design System -->
		<link
			rel="stylesheet"
			href="https://js.arcgis.com/calcite-components/2.13.2/calcite.css" />
		<script
			type="module"
			src="https://js.arcgis.com/calcite-components/2.13.2/calcite.esm.js"></script>

		<!-- ArcGIS Maps SDK theme -->
		<link
			rel="stylesheet"
			href="https://js.arcgis.com/4.31/esri/themes/light/main.css" />

		<!-- ArcGIS Map Components (provides <arcgis-map>, <arcgis-layer-list>, …). -->
		<script
			type="module"
			src="https://js.arcgis.com/4.31/map-components/arcgis-map-components.esm.js"></script>

		<link rel="stylesheet" href="styles.css" />
	</head>

	<body>
		<calcite-shell>
			<!-- Full-page map. Controls are slotted so they sit on top of it. -->
			<arcgis-map id="map">
				<arcgis-zoom position="top-right"></arcgis-zoom>
				<arcgis-home position="top-right"></arcgis-home>
				<arcgis-expand position="top-right" mode="floating" expanded>
					<arcgis-layer-list></arcgis-layer-list>
				</arcgis-expand>
				<arcgis-expand
					position="top-right"
					mode="floating"
					icon="basemap"
					group="top-right">
					<arcgis-basemap-gallery></arcgis-basemap-gallery>
				</arcgis-expand>
			</arcgis-map>

			<calcite-alert
				id="app-alert"
				auto-close
				auto-close-duration="medium"
				scale="m"
				slot="alerts">
				<div slot="title" id="alert-title"></div>
				<div slot="message" id="alert-message"></div>
			</calcite-alert>
		</calcite-shell>

		<!-- Closable survey info panel, floating over the map on the left. -->
		<div id="info-card" class="info-card">
			<calcite-panel id="info-panel" closable>
				<calcite-action
					slot="header-actions-start"
					icon="chevron-left"
					text="Back"
					id="back-btn"></calcite-action>
				<div slot="header-content" class="project-heading">
					<span class="project-title" id="info-title">Loading…</span>
					<span class="project-ref" id="info-ref"></span>
				</div>
				<calcite-chip
					slot="header-actions-end"
					id="status-chip"
					scale="s"
					kind="neutral"
					appearance="outline"
					hidden></calcite-chip>

				<div class="tab-body">
					<div id="info-sections"></div>
				</div>

				<calcite-button
					slot="footer"
					width="full"
					icon-start="user-plus"
					id="reassign-btn"
					hidden>
					Reassign surveyor
				</calcite-button>
				<calcite-button
					slot="footer"
					width="full"
					kind="brand"
					icon-start="check-circle"
					id="approve-btn"
					hidden>
					Approve survey
				</calcite-button>
			</calcite-panel>
		</div>

		<!-- Shown when the info panel is closed, to reopen it. -->
		<calcite-action
			id="info-reopen"
			class="info-reopen"
			icon="information"
			text="Survey info"
			text-enabled
			scale="l"
			hidden></calcite-action>

		<!-- Reassign sheet — identical to the Unassigned page's assignment sheet. -->
		<calcite-sheet
			id="assign-sheet"
			position="inline-end"
			width-scale="m"
			aria-labelledby="assign-heading">
			<calcite-panel>
				<div slot="header-content" class="project-heading">
					<span class="project-title" id="assign-heading">
						Reassign surveyor
					</span>
					<span class="project-ref" id="assign-subheading"></span>
				</div>
				<calcite-action
					slot="header-actions-end"
					icon="x"
					text="Close"
					id="assign-close"></calcite-action>

				<div class="sheet-body">
					<calcite-label>
						Surveyor <span class="req">*</span>
						<calcite-select id="assign-surveyor"></calcite-select>
					</calcite-label>
					<calcite-label>
						Priority
						<calcite-select id="assign-priority"></calcite-select>
					</calcite-label>
					<calcite-label>
						Due date
						<calcite-input-date-picker
							id="assign-due"></calcite-input-date-picker>
					</calcite-label>
					<calcite-label>
						Description
						<calcite-text-area
							id="assign-desc"
							placeholder="Optional notes for the surveyor…"></calcite-text-area>
					</calcite-label>
				</div>

				<calcite-button
					slot="footer-start"
					appearance="outline"
					kind="neutral"
					width="half"
					id="assign-cancel">
					Cancel
				</calcite-button>
				<calcite-button slot="footer-end" width="half" id="assign-submit">
					Reassign
				</calcite-button>
			</calcite-panel>
		</calcite-sheet>

		<calcite-scrim id="boot-scrim" loading></calcite-scrim>

		<script src="config.js"></script>
		<script type="module" src="map.js"></script>
	</body>
</html>
